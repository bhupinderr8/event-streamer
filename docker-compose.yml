services:
  postgres:
    image: postgres:16-alpine
    container_name: streamer-postgres
    restart: always
    environment:
      POSTGRES_USER: streamer
      POSTGRES_PASSWORD: streamer_pass
      POSTGRES_DB: events_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streamer -d events_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streamer-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:latest
    container_name: streamer-kafka
    restart: always
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx1024M -Xms256M"

  server:
    build:
      context: .
      target: server
      network: host
    container_name: streamer-server
    restart: always
    environment:
      PORT: ":50051"
      ADMIN_PORT: ":8080"
      REDIS_ADDR: "redis:6379"
      KAFKA_BROKERS: "kafka:29092"
      DLQ_PATH: "/data/dlq.log"
      RATE_LIMIT: "1000000"
      LEASE_BATCH_SIZE: "2000"
      LOG_LEVEL: "info"
      GOMEMLIMIT: "1500MiB"
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8080:8080"
    volumes:
      - dlq-data:/data
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  consumer:
    build:
      context: .
      target: consumer
      network: host
    container_name: streamer-consumer
    restart: always
    environment:
      KAFKA_BROKERS: "kafka:29092"
      KAFKA_TOPIC: "events"
      KAFKA_GROUP_ID: "event-streamer-consumers"
      DATABASE_URL: "postgres://streamer:streamer_pass@postgres:5432/events_db?sslmode=disable"
      BATCH_SIZE: "1000"
      BATCH_TIMEOUT_MS: "50"
    depends_on:
      kafka:
        condition: service_started
      postgres:
        condition: service_healthy

  bench:
    build:
      context: .
      target: bench
      network: host
    container_name: streamer-bench
    profiles:
      - bench
    environment:
      GOMAXPROCS: "2"
    depends_on:
      server:
        condition: service_healthy
    command: ["-addr=server:50051", "-mode=unary", "-duration=10s", "-concurrency=192", "-conns=24"]

volumes:
  pgdata:
  dlq-data: